<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Saved Game Menu</title>
   <link rel="stylesheet" href="load_style.css"> 
</head>
<body>
    <div id="loadGames">
        <h2>Select a Saved Game</h2>
        <div id="gamesList"></div>
        <button onclick="window.location.href='index.html'">Back to Game</button>
    </div>
    <script>
        fetch('list_games.php')
            .then(res => res.text())
            .then(data => {
                if (data === 'Not logged in') {
                    alert('Please log in first.');
                    window.location.href = 'index.html';
                    return;
                }
                const games = JSON.parse(data);
                const list = document.getElementById('gamesList');
                games.forEach(game => {
                    const item = document.createElement('div');
                    item.className = 'gameItem';
                    item.innerHTML = `<span>Game ${game.id} - ${game.current_player === 1 ? 'Red' : 'Black'}'s turn</span>
                                      <button onclick="loadGame(${game.id})">Load</button>`;
                    list.appendChild(item);
                });
            })
            .catch(error => alert('Error loading games: ' + error.message));

        function loadGame(gameId) {
            // Store the selected game ID
            localStorage.setItem('selectedGameId', gameId);
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
